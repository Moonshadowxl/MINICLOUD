      seed 720c11a3 · THE COLD VAULT
      THESIS: A personal server is a seed vault, not a dashboard. Work is deposited, sealed
        under frost, and kept cold while the power fails elsewhere. Refuses the arrangement
        every storage app ships: sidebar, file table, usage donut, one blue accent.
      OWN-WORLD: Basalt chamber ground, frost-white stencil register lettering (Archivo at
        width 68 for labels), glacier-ice hairlines, one warm amber portal light. Chambers
        and racks, never cards. Accession codes on everything. Frost means sealed; amber
        means issued to the open.
      STORY: You are admitted at the portal, read how much of the rack is filled, deposit
        work into the register, and issue an accession to the world when you choose.
      FIRST VIEWPORT: Rock ground, amber portal wedge raking from above, MINICLOUD on a
        vault plate, depositor plates in a row beneath it, keypad on pick. The primary
